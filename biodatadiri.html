<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri - 
                                Alexandra Kirana
                            </title>
    
    <!-- MENGHUBUNGKAN DENGAN FILE CSS EKSTERNAL -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menggunakan ID Selector #biodata-card dan Class Selector .card -->
    <div id="biodata-card" class="card">
        
        <!-- Menggunakan Element Selector h1 -->
        <h1 id="nama-siswa">
                                Alexandra Kirana
                            </h1>
        
        <!-- Menggunakan Class Selector .info-label dan Element Selector p -->
        <div style="margin-top: 20px;">
            <div class="info-label">Kelas / Jurusan:</div>
            <p id="kelas-siswa">
                                    XI RPL 1 (Rekayasa Perangkat Lunak)
                                </p>
        </div>

        <div style="margin-top: 15px;">
            <div class="info-label">Hobi:</div>
            <div id="hobi-container">
                <span class="badge">Coding</span>
                <span class="badge">Membaca Buku</span>
                <span class="badge">Desain Grafis</span>
            </div>
        </div>

        <!-- Menggunakan ID Selector #motto -->
        <div style="margin-top: 20px;">
            <div class="info-label">Motto Hidup:</div>
            <div id="motto">
                
                                    &quot;Belajar hari ini untuk menciptakan perubahan luar biasa di masa depan. Jangan takut gagal, takutlah jika tidak pernah mencoba.&quot;
                                
            </div>
        </div>

        <!-- Menggunakan Element Selector footer -->
        <footer>
            &copy; 2026 Tugas Web Dasar - Biodata Diri
        </footer>

    </div>

</body>
</html>
